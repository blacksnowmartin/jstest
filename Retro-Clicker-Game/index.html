<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Sprite Animation Game</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
            position: relative;
        }
        canvas {
            background: #333;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .ui-text {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .instructions {
            margin-top: 10px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-text">Score: <span id="score-display">0</span></div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="instructions">Click the jumping slime before it hides!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');

        let score = 0;

        // --- SPRITE CONFIGURATION ---
        // Generates a base64 dummy sprite sheet programmatically for standalone operation.
        // It simulates a horizontal sprite sheet containing 4 frames of a bouncing slime creature.
        const spriteSheet = new Image();
        spriteSheet.src = 'data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="256" height="64" viewBox="0 0 256 64"><rect width="64" height="64" fill="none"/><ellipse cx="32" cy="45" rx="25" ry="15" fill="%234caf50"/><ellipse cx="22" cy="40" rx="4" ry="4" fill="white"/><ellipse cx="42" cy="40" rx="4" ry="4" fill="white"/><rect x="64" width="64" height="64" fill="none"/><ellipse cx="96" cy="30" rx="20" ry="25" fill="%234caf50"/><ellipse cx="88" cy="25" rx="4" ry="4" fill="white"/><ellipse cx="104" cy="25" rx="4" ry="4" fill="white"/><rect x="128" width="64" height="64" fill="none"/><ellipse cx="160" cy="15" rx="18" ry="15" fill="%234caf50"/><ellipse cx="152" cy="15" rx="4" ry="4" fill="white"/><ellipse cx="168" cy="15" rx="4" ry="4" fill="white"/><rect x="192" width="64" height="64" fill="none"/><ellipse cx="224" cy="40" rx="24" ry="18" fill="%238bc34a"/><ellipse cx="216" cy="35" rx="4" ry="4" fill="white"/><ellipse cx="232" cy="35" rx="4" ry="4" fill="white"/></svg>';

        const SPRITE_WIDTH = 64;   // Width of a single frame
        const SPRITE_HEIGHT = 64;  // Height of a single frame
        const TOTAL_FRAMES = 4;    // Total frames across the row

        // --- GAME OBJECTS ---
        class Enemy {
            constructor() {
                this.resetPosition();
                this.frameX = 0;       // Track current frame column
                this.gameFrame = 0;
                this.staggerFrames = 8; // Lower value = faster animation speed
            }

            resetPosition() {
                this.x = Math.random() * (canvas.width - SPRITE_WIDTH);
                this.y = Math.random() * (canvas.height - SPRITE_HEIGHT);
            }

            update() {
                // Throttle animation frame switching
                this.gameFrame++;
                if (this.gameFrame % this.staggerFrames === 0) {
                    this.frameX = (this.frameX + 1) % TOTAL_FRAMES;
                    
                    // Periodically reposition to force the player to chase it
                    if (this.frameX === 0 && Math.random() > 0.5) {
                        this.resetPosition();
                    }
                }
            }

            draw() {
                // 9-Argument drawImage: image, sx, sy, sw, sh, dx, dy, dw, dh
                ctx.drawImage(
                    spriteSheet,
                    this.frameX * SPRITE_WIDTH, 0, // Source coordinates (X, Y)
                    SPRITE_WIDTH, SPRITE_HEIGHT,   // Source size (width, height)
                    this.x, this.y,               // Canvas destination (X, Y)
                    SPRITE_WIDTH, SPRITE_HEIGHT    // Canvas output size
                );
            }
        }

        const targetSlime = new Enemy();

        // --- CLICK ACCURACY DETECTION ---
        canvas.addEventListener('mousedown', (event) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            // Check if user clicked inside the sprite's boundary box
            if (
                clickX >= targetSlime.x &&
                clickX <= targetSlime.x + SPRITE_WIDTH &&
                clickY >= targetSlime.y &&
                clickY <= targetSlime.y + SPRITE_HEIGHT
            ) {
                score++;
                scoreDisplay.textContent = score;
                targetSlime.resetPosition();
            }
        });

        // --- CORE GAME LOOP ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Wipe the frame
            
            targetSlime.update();
            targetSlime.draw();

            requestAnimationFrame(animate); // Recursively recall loop
        }

        // Initialize game after asset resolution
        spriteSheet.onload = () => {
            animate();
        };
    </script>
</body>
</html>
